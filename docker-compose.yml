name: corypulse

services:
  db:
    image: timescale/timescaledb:latest-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corypulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corypulse}
      POSTGRES_DB: ${POSTGRES_DB:-corypulse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-corypulse} -d $${POSTGRES_DB:-corypulse}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      ROLE: api
      DATABASE_URL: postgres://${POSTGRES_USER:-corypulse}:${POSTGRES_PASSWORD:-corypulse}@db:5432/${POSTGRES_DB:-corypulse}
      INGEST_ENABLED: "0"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8787"
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  ingest:
    build: .
    restart: unless-stopped
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      ROLE: ingest
      DATABASE_URL: postgres://${POSTGRES_USER:-corypulse}:${POSTGRES_PASSWORD:-corypulse}@db:5432/${POSTGRES_DB:-corypulse}
      SYSLOG_PORT: "5514"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1813:1813/udp"
      - "514:5514/udp"
      - "1514:1514/tcp"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
